    <a class="navbar-brand fw-bold" routerLink="/">Compartir gastos</a>

    <div class="navbar-nav ms-auto align-items-center gap-2">
      @if (auth.estaLogueado()) {
        <span class="navbar-text me-2">Hola, {{ auth.usuario()?.nombre }}</span>
        <button type="button" class="btn btn-outline-light btn-sm" (click)="auth.logout()">
          Salir
        </button>
      } @else {
        <a class="nav-link" routerLink="/login" routerLinkActive="active">Entrar</a>
        <a class="btn btn-light btn-sm" routerLink="/registro">Crear cuenta</a>
      }
    </div>
  </div>
</nav>

<main class="container pb-5">
